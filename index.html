<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEIR Weather</title>
  <script defer src="script.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-4xl mx-auto p-4">
    <header class="text-center mb-6">
      <h1 class="text-4xl font-semibold mb-2">WEIR Weather</h1>
      <p class="text-sm text-gray-500">Live conditions and forecast for Newton, MS</p>
    </header>
    <section id="radar" class="mb-6">
      <h2 class="text-2xl font-medium mb-2">Live Radar</h2>
      <div class="rounded overflow-hidden shadow-lg">
        <iframe src="https://embed.windy.com/embed2.html?lat=32.321&lon=-89.112&zoom=7&level=surface&overlay=radar&menu=&message=true" width="100%" height="450" frameborder="0"></iframe>
      </div>
    </section>
    <section id="current" class="mb-6">
      <h2 class="text-2xl font-medium mb-2">Current Conditions</h2>
      <div id="current-weather" class="grid grid-cols-2 gap-4 p-4 bg-white rounded shadow"></div>
    </section>
    <section id="forecast">
      <h2 class="text-2xl font-medium mb-2">7-Day Forecast</h2>
      <div id="forecast-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </section>
    <footer class="mt-10 text-center text-gray-400 text-sm">
      &copy; 2025 WEIR Weather. Data from OpenWeatherMap.
    </footer>
  </div>
</body>
</html>
